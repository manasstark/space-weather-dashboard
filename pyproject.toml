[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["venv", "notebooks", "catboost_info"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["venv", "notebooks"]
